<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>유솔과의 대화 시작하기</title>
<style>
:root{--bg:#fbf4e6;--card:#fffaf0;--her:#fffdf7;--me:#e0b97d;--meText:#3e2b15;--text:#4b3622;--sub:#9b8466;--line:#ecdcc0;--accent:#c28a45;--btn:#fbefd8;--av:#ecd3a5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a2218;--card:#352b1f;--her:#43372a;--me:#c9a06a;--meText:#2a1c0c;--text:#f3e7d2;--sub:#bfa982;--line:#53432f;--accent:#d9a860;--btn:#43372a;--av:#6a5638}}
:root[data-theme="dark"]{--bg:#2a2218;--card:#352b1f;--her:#43372a;--me:#c9a06a;--meText:#2a1c0c;--text:#f3e7d2;--sub:#bfa982;--line:#53432f;--accent:#d9a860;--btn:#43372a;--av:#6a5638}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;display:flex;justify-content:center}
#app{position:relative;width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;background:var(--card);overflow:hidden}
header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.av{width:40px;height:40px;border-radius:50%;background:var(--av);display:grid;place-items:center;font-size:23px;flex:none}
.av.big{width:84px;height:84px;font-size:46px}
.who{flex:1;min-width:0}
.who b{display:block;font-size:16px}
.who span{font-size:12px;color:var(--sub)}
.gauge{display:flex;align-items:center;gap:6px;width:112px}
.heart{color:var(--accent);font-size:16px;line-height:1;display:inline-block}
.heart.up{animation:beat .6s}
.heart.down{animation:shake .5s;color:var(--sub)}
@keyframes beat{40%{transform:scale(1.5)}}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.bar{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .7s}
#log{flex:1;overflow-y:auto;padding:16px 12px;display:flex;flex-direction:column;gap:4px;background:var(--bg)}
.row{display:flex;gap:8px;align-items:flex-start}
.row.me{justify-content:flex-end}
.row.first{margin-top:8px}
.sav{width:32px;height:32px;border-radius:50%;background:var(--av);display:grid;place-items:center;font-size:18px;flex:none}
.sav.sp{background:none}
.col{display:flex;flex-direction:column;gap:3px;max-width:78%}
.nm{font-size:12px;color:var(--sub)}
.m{padding:9px 13px;border-radius:16px;line-height:1.5;font-size:15px;word-break:keep-all;white-space:pre-wrap;width:fit-content}
.m.her{background:var(--her);border:1px solid var(--line)}
.m.me{background:var(--me);color:var(--meText);max-width:78%}
.typing{display:flex;gap:4px;padding:13px 15px;background:var(--her);border:1px solid var(--line);border-radius:16px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--sub);animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}
.dv{align-self:stretch;display:flex;align-items:center;gap:10px;margin:20px 4px 10px;color:var(--sub);font-size:12px}
.dv::before,.dv::after{content:"";flex:1;height:1px;background:currentColor;opacity:.4}
.dv:empty{gap:0}
#log{transition:filter 4s,opacity 4s}
#log.dim{filter:blur(7px);opacity:.35}
.m.pic{text-align:center;padding:12px 18px}
.pe{font-size:56px;line-height:1.2}
.m.pic div:last-child{font-size:12px;color:var(--sub)}
.m.gift{border:1.5px dashed var(--meText)}
.m.big{font-size:46px;background:none;border:0;padding:0}
.m.del{font-style:italic;opacity:.6}
.gauge{position:relative;cursor:pointer}
.gn{position:absolute;top:calc(100% + 8px);right:0;z-index:3;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 12px;font-size:13px;font-weight:700;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s}
.gn.on{opacity:1}
.ov{z-index:4}
.ntf{position:absolute;top:8px;left:8px;right:8px;display:flex;flex-direction:column;gap:6px;z-index:5;pointer-events:none}
.nt{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.2);animation:drop .4s}
.nt b{font-size:13px}
.nt p{margin:2px 0 0;font-size:14px}
@keyframes drop{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
.sys{align-self:center;margin:14px 0 6px;padding:7px 14px;border-radius:14px;background:var(--line);color:var(--sub);font-size:13px;text-align:center}
#choices{padding:10px 14px;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);background:var(--card)}
#choices:empty{display:none}
#choices button,.btn{font:inherit;font-size:14px;text-align:left;padding:11px 14px;border-radius:14px;border:1.5px solid var(--accent);background:var(--btn);color:var(--text);cursor:pointer;line-height:1.4}
#choices button:hover,#choices button:focus-visible,.btn:hover,.btn:focus-visible{background:var(--me);color:var(--meText);outline:none}
.ibar{display:flex;gap:8px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);background:var(--card)}
.ibtxt,.ibar input{flex:1;min-width:0;min-height:40px;padding:10px 14px;border-radius:20px;background:var(--bg);border:1px solid var(--line);font:inherit;font-size:15px;line-height:1.4;color:var(--text);word-break:keep-all}
.ph{color:var(--sub)}
.ibar.off .ibtxt{opacity:.75;text-align:center}
.send{width:40px;height:40px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:18px;flex:none;display:grid;place-items:center}
button.send{cursor:pointer}
.ibar.off .send{opacity:.4}
.intro{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--bg);padding:24px;text-align:center}
.intro b{font-size:20px}
.intro>span{font-size:13px;color:var(--sub)}
.intro .sys{margin-top:16px}
.title{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:32px 28px;background:var(--bg);text-align:center}
.title h1{margin:0;font-size:24px;line-height:1.35}
.title p{margin:0;font-size:14px;color:var(--sub)}
.title input{width:100%;font:inherit;font-size:16px;padding:12px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--text);text-align:center}
.title .btn{width:100%}
.spd{margin-left:8px;flex:none;font:inherit;font-size:12px;font-weight:700;padding:6px 10px;border-radius:14px;border:1.5px solid var(--accent);background:var(--btn);color:var(--text);cursor:pointer}
.spd:hover,.spd:focus-visible{background:var(--me);color:var(--meText);outline:none}
.end{text-align:center;padding:10px 14px 18px}
.end h2{margin:0 0 12px;font-size:18px}
.ov{position:absolute;inset:0;background:rgba(40,28,12,.45);display:grid;place-items:center;animation:fade .6s}
.ov div{background:var(--card);border-radius:20px;padding:28px 24px;text-align:center;width:min(300px,84%);display:flex;flex-direction:column;gap:12px}
.ov h2{margin:0;font-size:19px;line-height:1.4}
.ov p{margin:0;font-size:13px;color:var(--sub)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.typing i,.heart,.ov{animation:none!important}.bar i{transition:none}}
</style>
</head>

};
// 엔딩. 점수 엔딩(score)은 위에서부터 min 이상인 첫 항목이 나옴
const E={
block:{no:"엔딩 1",sys:"유솔에게 차단당했습니다."},
del:{no:"엔딩 2",sys:"유솔님이 친구삭제 되셨습니다."},
far:{no:"엔딩 3",sys:"유솔과 멀어졌습니다.",sub:"좋은 친구를 잃어서 속상해 보이네요. 그래도 당신을 곧 잊을 것입니다."},
del2:{no:"엔딩 4",sys:"유솔님이 친구삭제 되셨습니다."},
fade:{no:"엔딩 5",sys:"이후 대화가 이어지지 않았습니다."},
score:[{min:30,no:"엔딩 8",sys:"유솔과 베스트 프렌드가 되었습니다."},{min:15,no:"엔딩 7",sys:"유솔과 좋은 친구가 되었습니다."},{min:0,no:"엔딩 6",sys:"유솔과의 대화가 끝났습니다."}]
};
const START=0,MAX=70; // 시작 호감도와 게이지 만점(숫자는 화면에 보이지 않음)
let aff=START,name="",last=null,app=document.getElementById("app");
let SPD=1,curU="",drawn=0;
const FN={c:0,n:0},U={s5:"s5",s5a:"s5",s5b:"s5",s5c:"s5",s6:"s5",s7:"s5",s8:"s8",s81:"s8",s9:"s9",s11:"s11",s11a:"s11",s11b:"s11",s12:"s12",s12a:"s12",s13:"s13",s15:"s15",s16:"s16",s16a:"s16"},UN=[{id:"s5"},{id:"s8",after:3},{id:"s9"},{id:"s11"},{id:"s12",req:"s11"},{id:"s13",req:"s11"},{id:"s15"},{id:"s16"}],EV=[{id:"s10",min:14},{id:"s14",min:25},{id:"s17",min:37}]; // 재생 속도(1배속, 2배속). 모든 대기 시간이 이 값만큼 빨라짐
const sleep=ms=>new Promise(r=>{let left=ms;const t=setInterval(()=>{left-=10*SPD;if(left<=0){clearInterval(t);r()}},10)});
const f=t=>t.replace(/\{n\}/g,name);
const $=id=>document.getElementById(id);
function start(){
 app.innerHTML='<div class="title"><div class="av big">🐰</div><h1>유솔과의 대화 시작하기</h1><p>추천 연락에 올라온 유솔에게 말을 걸어볼까요?</p><input id="nm" maxlength="8" placeholder="내 이름을 입력하세요" autocomplete="off"><button class="btn" id="go" style="text-align:center">대화 시작하기</button></div>';
 const go=()=>{name=$("nm").value.trim()||"나";chat()};
 $("go").onclick=go;
 $("nm").onkeydown=e=>{if(e.key==="Enter")go()};
}
function chat(){
 aff=START;last=null;EV.forEach(e=>e.done=false);UN.forEach(u=>u.done=false);drawn=0;curU="";FN.c=0;FN.n=0;
 app.innerHTML='<header><div class="av">🐰</div><div class="who"><b>유솔</b><span>추천 연락</span></div><div class="gauge" id="gau" role="button" tabindex="0" aria-label="호감도 보기"><span class="heart" id="hrt">♥</span><div class="bar"><i id="fill"></i></div><span class="gn" id="gn"></span></div><button class="spd" id="spd" aria-label="재생 속도">'+SPD+'x</button></header><div id="log" aria-live="polite"></div><div id="choices"></div><div class="ibar" id="ibar"><div class="ibtxt ph" id="ib">메시지 입력</div><div class="send">↑</div></div>';
 $("spd").onclick=toggleSpd;$("gau").onclick=showNum;$("gau").onkeydown=e=>{if(e.key==="Enter")showNum()};gauge(0);sleep(800+Math.random()*1000).then(()=>play("s1"));
}
let gt;
function showNum(){const g=$("gn");g.textContent=aff+"/"+MAX;g.classList.add("on");clearTimeout(gt);gt=setTimeout(()=>g.classList.remove("on"),2500)}
function toggleSpd(){SPD=SPD===1?2:1;$("spd").textContent=SPD+"x"}
function gauge(dir){
 $("fill").style.width=Math.max(0,Math.min(100,aff/MAX*100))+"%";
 const gn=$("gn");if(gn.classList.contains("on"))gn.textContent=aff+"/"+MAX;
 const h=$("hrt");h.className="heart";
 if(dir){void h.offsetWidth;h.className="heart "+(dir>0?"up":"down")}
}
function add(who,t){
 const lg=$("log"),first=last!==who;last=who;
 const row=document.createElement("div");row.className="row "+who+(first?" first":"");
 const b=document.createElement("div");b.className="m "+who;b.textContent=t;
 if(t.startsWith("[사진]")){b.className+=" pic";b.textContent="";const e=document.createElement("div");e.className="pe";e.textContent="🍰";const c=document.createElement("div");c.textContent=t.slice(4).trim();b.append(e,c)}
 else if(t.startsWith("[기프티콘]"))b.className+=" gift";
 else if(/^\p{Extended_Pictographic}+$/u.test(t))b.className+=" big";
 if(who==="her"){
  const a=document.createElement("div");a.className="sav"+(first?"":" sp");a.textContent=first?"🐰":"";
  const col=document.createElement("div");col.className="col";
  if(first){const nm=document.createElement("div");nm.className="nm";nm.textContent="유솔";col.appendChild(nm)}
  col.appendChild(b);row.append(a,col);
 }else row.appendChild(b);
 lg.appendChild(row);lg.scrollTop=lg.scrollHeight;
}
function divider(t){last=null;const d=document.createElement("div");d.className="dv";const lg=$("log");lg.appendChild(d);lg.scrollTop=lg.scrollHeight}
function sys(t){last=null;const d=document.createElement("div");d.className="sys";d.textContent=t;const lg=$("log");lg.appendChild(d);lg.scrollTop=lg.scrollHeight}
// 내 메시지: 입력창에 한 글자씩 타자를 친 뒤 보냄
async function typeMe(t){
 const ib=$("ib");ib.classList.remove("ph");ib.textContent="";
 for(const ch of t){ib.textContent+=ch;await sleep(85)}
 await sleep(600);
 ib.textContent="메시지 입력";ib.classList.add("ph");
 add("me",t);
}
async function say(lines){
 for(const t of lines){
  if(t==="|"){await sleep(1500);continue}
  if(t==="||"){await sleep(3000);continue}
  if(t==="="){divider();await sleep(1500);continue}
  if(t==="-del"){await sleep(1500);const m=document.querySelectorAll(".m.me"),b=m[m.length-1];b.textContent="삭제된 메시지입니다.";b.classList.add("del");await sleep(800);continue}
  if(t[0]===">"){await sleep(1200);await typeMe(f(t.slice(1)));continue}
  const lg=$("log"),row=document.createElement("div");row.className="row";
  row.innerHTML='<div class="sav sp"></div><div class="typing"><i></i><i></i><i></i></div>';
  lg.appendChild(row);lg.scrollTop=lg.scrollHeight;
  const q=t[0]==="~";await sleep(q?900+Math.random()*400:2000+Math.random()*1000);row.remove();add("her",f(q?t.slice(1):t));
 }
}
function nxt(){
 for(const e of EV)if(!e.done&&aff>=e.min){e.done=true;return e.id}
 const ok=UN.filter(u=>!u.done&&(!u.req||UN.find(x=>x.id===u.req).done)&&(!u.after||drawn>=u.after));
 if(!ok.length)return "E:end";
 const u=ok[Math.floor(Math.random()*ok.length)];u.done=true;drawn++;return u.id;
}
async function play(id){
 if(id==="@f")id=FN.n>=2?"s174":"s175";
 if(id==="@r"||id==="E:score"||(U[id]&&U[id]!==curU))id=nxt();
 if(U[id])curU=U[id];
 if(id.startsWith("E:"))return finish(id.slice(2));
 const s=S[id];
 if(s.div)divider();if(s.wait)await sleep(s.wait);
 await say(s.l);
 if(s.d){aff=Math.max(0,aff+s.d);gauge(s.d)}
 if(s.f)return free(s);
 if(!s.c)return play(s.n);
 const box=$("choices");
 s.c.forEach(c=>{const b=document.createElement("button");b.textContent=f(c.t);b.onclick=()=>pick(c);box.appendChild(b)});
 $("log").scrollTop=1e5;
}
async function pick(c){
 $("choices").innerHTML="";
 if(c.k)FN[c.k]++;
 if(!c.x)await typeMe(f(c.m||c.t));
 aff=Math.max(0,aff+c.d);gauge(c.d);
 await sleep(800);
 await say(c.r);
 play(c.n);
}
async function confirmDel(){
 await sleep(1000);
 const o=document.createElement("div");o.className="ov";
 o.innerHTML='<div><h2>유솔을 친구 삭제하시겠습니까?</h2><button class="btn" data-k="y" style="text-align:center">예</button><button class="btn" data-k="n" style="text-align:center">아니요</button></div>';
 o.querySelectorAll("button").forEach(b=>b.onclick=()=>{o.remove();finish(b.dataset.k==="y"?"del":"fade")});
 app.appendChild(o);
}
function notify(list){
 const box=document.createElement("div");box.className="ntf";app.appendChild(box);
 list.forEach((t,i)=>setTimeout(()=>{
  const n=document.createElement("div");n.className="nt";
  const a=document.createElement("span");a.className="sav";a.textContent="🐰";
  const w=document.createElement("div"),b=document.createElement("b"),p=document.createElement("p");
  b.textContent="유솔";p.textContent=t;w.append(b,p);n.append(a,w);box.appendChild(n);
 },1600*(i+1)));
}
async function free(s){
 const ib=$("ibar");ib.innerHTML='<input id="fi" maxlength="30" placeholder="메시지 입력" autocomplete="off"><button class="send" id="fs">↑</button>';
 const t=await new Promise(res=>{const g=()=>{const v=$("fi").value.trim();if(v)res(v)};$("fs").onclick=g;$("fi").onkeydown=e=>{if(e.key==="Enter")g()};$("fi").focus()});
 ib.innerHTML='<div class="ibtxt ph" id="ib">메시지 입력</div><div class="send">↑</div>';
 add("me",t);await sleep(800);
 const q=s.f,ok=!q.test||new RegExp(q.test).test(t.replace(/파이팅|떡볶이/g,"")),d=ok?(q.d||0):q.bd;
 aff=Math.max(0,aff+d);gauge(d);await sleep(500);
 await say(ok?(q.rand?q.rand[Math.floor(Math.random()*q.rand.length)]:q.r):q.br);
 play(s.n);
}
function lock(msg){const ib=$("ib");ib.classList.remove("ph");ib.textContent=msg;$("ibar").classList.add("off")}
function overlay(e){
 const o=document.createElement("div");o.className="ov";
 o.innerHTML='<div><h2></h2><p></p><p class="sb"></p><button class="btn" style="text-align:center">처음부터 다시하기</button></div>';
 o.querySelector("h2").textContent=e.sys;o.querySelector("p").textContent=e.no;o.querySelector(".sb").textContent=e.sub||"";
 o.querySelector("button").onclick=start;app.appendChild(o);
}
async function finish(k){
 if(k==="confirm")return confirmDel();
 const e=k==="score"||k==="end"?E.score.find(x=>aff>=x.min):E[k];
 await sleep(900);divider();
 if(k==="far"){$("log").classList.add("dim");await sleep(4500);lock("대화가 끝났습니다.");overlay(e);return}
 if(k==="block"){sys("대화할 수 없는 상대입니다.");lock("대화할 수 없는 상대입니다.");await sleep(1200);overlay(e);return}
 if(k==="del"||k==="del2"){sys("대화할 수 없는 상대입니다.");lock("대화할 수 없는 상대입니다.");await sleep(800);overlay(e);if(k==="del")notify(["저기요?","어디갔어요?","ㅠㅠ..."]);return}
 sys(e.sys);lock("대화가 끝났습니다.");
 const d=document.createElement("div");d.className="end";
 d.innerHTML='<h2></h2><button class="btn" style="text-align:center;width:100%">처음부터 다시하기</button>';
 d.querySelector("h2").textContent=e.no;
 d.querySelector("button").onclick=start;
 const lg=$("log");lg.appendChild(d);lg.scrollTop=lg.scrollHeight;
}
start();
</script>
